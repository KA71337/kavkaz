# Render Blueprint: https://render.com/docs/blueprint-spec
# One free web service runs both the static frontend and the Socket.IO multiplayer backend.
services:
  - type: web
    name: kavkaz-front
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
