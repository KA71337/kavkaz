<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="description" content="Кавказский фронт — многопользовательская браузерная стратегия о захвате провинций." />
  <title>Кавказский фронт — стратегия</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- title font is not render-blocking: the page is usable with the system font meanwhile -->
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <!-- fetch the map and core modules in parallel instead of discovering them one by one -->
  <link rel="preload" href="/data/map.json" as="fetch" crossorigin />
  <link rel="preload" href="/assets/map.png" as="image" />
  <link rel="modulepreload" href="/js/app.js" />
  <link rel="modulepreload" href="/js/map/MapView.js" />
  <link rel="modulepreload" href="/js/map/panzoom.js" />
  <link rel="modulepreload" href="/shared/flags.js" />
  <link rel="modulepreload" href="/shared/sync.js" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div id="app">
    <!-- ============ MAIN MENU ============ -->
    <section id="screen-menu" class="screen is-active" aria-label="Главное меню">
      <div class="menu-bg" aria-hidden="true"></div>
      <div class="menu-card">
        <div class="menu-emblem" aria-hidden="true">⚔</div>
        <h1 class="menu-title">Кавказский фронт</h1>
        <p class="menu-sub">Выберите страну. Расширяйте границы. Захватывайте провинции.</p>
        <label class="field">
          <span>Ваше имя</span>
          <input id="menu-name" maxlength="20" autocomplete="nickname" placeholder="Командир" />
        </label>
        <button id="menu-play" class="btn btn-primary btn-xl" type="button">Играть</button>
        <details class="menu-room">
          <summary>Играть с друзьями в отдельной комнате</summary>
          <label class="field">
            <span>Код комнаты</span>
            <input id="menu-room" maxlength="24" placeholder="global" autocomplete="off" />
          </label>
          <p class="hint">Одинаковый код — одна игровая сессия. Пусто — общая комната.</p>
        </details>
        <div class="menu-status"><span id="conn-dot" class="dot"></span><span id="conn-text">Подключение…</span></div>
      </div>
    </section>

    <!-- ============ MAP (country selection + game) ============ -->
    <section id="screen-game" class="screen" aria-label="Игровая карта">
      <div id="map-wrap" class="map-wrap"></div>
      <div class="zoom-ctrl" aria-label="Масштаб">
        <button type="button" data-zoom="in" aria-label="Приблизить">+</button>
        <button type="button" data-zoom="out" aria-label="Отдалить">−</button>
        <button type="button" data-zoom="reset" aria-label="Показать всю карту">⤢</button>
      </div>
      <button id="fs-btn" class="fs-btn" type="button" aria-pressed="false" title="Полный экран">⛶ <span>Полный экран</span></button>

      <!-- country selection overlay -->
      <div id="select-ui" class="layer" hidden>
        <header class="select-head panel">
          <button id="select-back" class="btn btn-ghost btn-sm" type="button">← Меню</button>
          <div>
            <h2>Выберите страну</h2>
            <p class="muted">Нажмите на страну на карте или в списке</p>
          </div>
        </header>
        <div id="select-list" class="select-list panel"></div>
        <div id="select-card" class="select-card panel" hidden></div>
      </div>

      <!-- in-game HUD -->
      <div id="game-ui" class="layer" hidden>
        <div id="hud-player" class="hud-player panel"></div>
        <div id="hud-actions" class="hud-actions"></div>
        <aside id="side" class="side panel">
          <button id="side-toggle" class="side-grip" type="button" aria-label="Развернуть панель"></button>
          <nav id="side-tabs" class="tabs" role="tablist"></nav>
          <div id="side-body" class="side-body"></div>
        </aside>
        <div id="province-pop" class="province-pop panel" hidden></div>
        <div id="voice" class="voice panel" aria-label="Голосовой чат"></div>
      </div>

      <div id="target-banner" class="target-banner panel" hidden></div>
      <div id="battle-overlay" class="battle-overlay" hidden></div>
    </section>

    <div id="rotate-hint" class="rotate-hint" role="status" hidden><b>⟳</b><span></span></div>
    <div id="modal-root"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </div>

  <script src="/socket.io/socket.io.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
